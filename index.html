<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wayleaf</title>
<meta name="application-name" content="Wayleaf">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23D9677A%22/%3E%3Cpath d=%22M9 23C9 14 15 8 24 8c0 9-6 15-15 15z%22 fill=%22%23fff%22/%3E%3Cpath d=%22M9 23l9-9%22 stroke=%22%23D9677A%22 stroke-width=%221.6%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<meta name="description" content="Wayleaf（ウェイリーフ）｜行き先を入れるだけで、見どころの写真・日ごとの予定・ごはん屋さんまで入った旅行プランをAIが作ります。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: 画面いっぱいの行き先写真をその場に固定し、スクロールで写真がズーム＆暗くなる。
   その上を白いプランのシートがせり上がって覆う（Appleの製品ページのような重なり）。 */
:root{
  --bg:#FFFFFF; --soft:#F6F4F3; --card:#FFFFFF; --ink:#232228; --muted:#7A7680; --line:#ECE8E6;
  --accent:#D9677A; --accent-soft:#FBEDEF; --sage:#7FA394; --sage-soft:#EEF4F1; --on-accent:#FFFFFF;
  --photo-ink:#FFFFFF; --glass:rgba(255,255,255,.14); --glass-line:rgba(255,255,255,.34);
  --field:rgba(255,255,255,.94); --field-ink:#232228;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
  --p:0; --tabh:58px; --bar:rgba(255,255,255,.82);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141317; --soft:#1F1D22; --card:#1F1D22; --ink:#F0EDF0; --muted:#A6A2AB; --line:#322F37;
  --accent:#EE8FA0; --accent-soft:#3A2629; --sage:#93BBAB; --sage-soft:#22302B; --on-accent:#2A1418;
  --field:rgba(28,27,32,.88); --field-ink:#F0EDF0; --bar:rgba(22,21,26,.82); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;overflow-x:hidden}
img{max-width:100%;display:block}
/* 地図のタイル画像には上の設定を効かせない（効くと地図が真っ白になる） */
.leaflet-container img{max-width:none!important;max-height:none!important;display:block}
[hidden]{display:none!important}
button:focus-visible,a:focus-visible,summary:focus-visible,.chips label:focus-within span{outline:2px solid var(--accent);outline-offset:2px}
.gutter{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* ===== 固定される写真 ===== */
.stage{position:relative}
.pin{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;z-index:0;background:linear-gradient(160deg,#C98296 0%,#8C97C9 52%,#6FAE9F 100%)}
.pin img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s ease;
  transform:scale(calc(1.02 + var(--p) * .14));filter:brightness(calc(1 - var(--p) * .5));will-change:transform}
.pin img.on{opacity:1}
.pin::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(15,12,20,.38) 0%,rgba(15,12,20,0) 28%,rgba(15,12,20,.05) 50%,rgba(15,12,20,.62) 100%)}

/* ===== 写真の上の文字と入力欄 ===== */
.hero{position:relative;z-index:1;margin-top:-100vh;margin-top:-100svh;min-height:100vh;min-height:100svh;
  display:flex;flex-direction:column;color:var(--photo-ink);
  padding-top:max(18px,env(safe-area-inset-top,0px));padding-bottom:calc(20px + var(--tabh) + env(safe-area-inset-bottom,0px))}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;max-width:1120px;width:100%;margin:0 auto}
.logo{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.04em;margin:0;text-shadow:0 1px 10px rgba(0,0,0,.25);display:flex;align-items:center;gap:7px}
.logo svg{width:20px;height:20px;flex:none;filter:drop-shadow(0 1px 6px rgba(0,0,0,.25))}
.logo small{font-family:var(--f-body);font-size:10px;font-weight:700;letter-spacing:.2em;opacity:.85;margin-left:2px}
.credit-hero{font-size:10px;color:rgba(255,255,255,.8);text-decoration:none;max-width:50%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.credit-hero:hover{color:#fff;text-decoration:underline}
.herotext{max-width:1120px;width:100%;margin:auto auto 26px;
  opacity:calc(1 - var(--p) * 1.6);transform:translateY(calc(var(--p) * -70px))}
.eyebrow-w{font-size:12px;font-weight:700;letter-spacing:.3em;margin:0 0 4px;opacity:.9}
.place-name{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,15vw,184px);line-height:1;margin:0;letter-spacing:.04em;
  text-shadow:0 4px 40px rgba(0,0,0,.25);text-wrap:balance;overflow-wrap:anywhere}
.hero-title{font-family:var(--f-display);font-weight:600;font-size:clamp(17px,2.4vw,24px);margin:14px 0 0;max-width:34em;text-shadow:0 1px 12px rgba(0,0,0,.35);text-wrap:balance}

.glass{max-width:1120px;width:100%;margin:0 auto;background:var(--glass);border:1px solid var(--glass-line);border-radius:24px;padding:16px;
  -webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);
  opacity:calc(1 - var(--p) * 1.3)}
.grid{display:grid;grid-template-columns:2fr 1fr 1fr 1.3fr auto;gap:10px;align-items:end}
@media (max-width:820px){.grid{grid-template-columns:1fr 1fr}.grid .wide,.grid .go{grid-column:1/-1}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;letter-spacing:.1em;min-width:0}
.glass label.f{color:rgba(255,255,255,.92)}
input,select,textarea{font:inherit;font-size:16px;color:var(--field-ink);background:var(--field);border:1px solid transparent;border-radius:12px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:60px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(217,103,122,.35)}
.go{font:inherit;font-weight:700;font-size:15px;letter-spacing:.1em;border:0;border-radius:12px;padding:11px 22px;background:var(--accent);color:#fff;cursor:pointer;white-space:nowrap;height:46px}
.go:hover{filter:brightness(1.06)}
.go:disabled{opacity:.6;cursor:wait}
details.more-opts{margin-top:12px}
details.more-opts summary{cursor:pointer;font-size:13px;font-weight:700;list-style:none;display:inline-flex;align-items:center;gap:6px;color:#fff;opacity:.92}
details.more-opts summary::-webkit-details-marker{display:none}
details.more-opts summary::after{content:"＋";font-weight:400}
details.more-opts[open] summary::after{content:"−"}
.opts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}
.opts .full{grid-column:1/-1}
@media (max-width:820px){.opts{grid-template-columns:1fr 1fr}}
.legend{font-size:11px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.92);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{cursor:pointer}
.chips input{position:absolute;opacity:0;width:1px;height:1px}
.chips span{display:inline-block;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);font-size:13px;color:#fff}
.chips input:checked + span{background:#fff;color:#232228;border-color:#fff}
.status{font-size:13px;font-weight:700;min-height:1.2em;margin:10px 2px 0;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.status.err{color:#FFD3DA}
.cue{display:flex;justify-content:center;margin-top:18px;opacity:calc(1 - var(--p) * 3)}
.cue button{font:inherit;background:none;border:0;cursor:pointer;color:#fff;font-size:12px;font-weight:700;letter-spacing:.16em;display:flex;flex-direction:column;align-items:center;gap:4px}
.cue button span{display:block;width:1px;height:26px;background:linear-gradient(#fff,transparent)}
@media (prefers-reduced-motion:no-preference){.cue button span{animation:drip 1.8s ease-in-out infinite}
  @keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}}

/* ===== せり上がってくるプランのシート ===== */
.sheet{position:relative;z-index:2;background:var(--bg);border-radius:34px 34px 0 0;box-shadow:0 -24px 60px rgba(10,8,14,.22);
  padding-top:48px;padding-bottom:calc(60px + var(--tabh) + env(safe-area-inset-bottom,0px))}
.sheet::before{content:"";position:absolute;top:12px;left:50%;width:44px;height:5px;margin-left:-22px;border-radius:999px;background:var(--line)}
.inner{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:56px}
.loading .inner{opacity:.4;transition:opacity .3s}

.eyebrow{font-size:11px;font-weight:700;letter-spacing:.26em;color:var(--accent);margin:0 0 8px}
.intro h2{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4.4vw,42px);line-height:1.4;margin:0 0 14px;text-wrap:balance}
.intro .sum{margin:0;max-width:56ch;font-size:16px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.meta span{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 12px}

.secthead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 16px;flex-wrap:wrap}
.secthead h3{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,3vw,28px);margin:0}
.secthead span{font-size:12px;color:var(--muted)}
/* 見どころ：横スワイプの大きな写真カード */
.rail{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 14px;margin:0 -2px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.hcard{flex:0 0 min(78vw,320px);scroll-snap-align:start;display:flex;flex-direction:column;gap:10px;min-width:0}
.ph{position:relative;overflow:hidden;background:var(--g,var(--soft));border-radius:20px}
.ph img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s, transform .8s}
.ph img.on{opacity:1}
.hcard .ph{aspect-ratio:4/5;max-width:100%}
.hcard:hover .ph img.on{transform:scale(1.04)}
.hcard .ph .nm{position:absolute;left:16px;right:16px;bottom:14px;z-index:1;color:#fff;font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.35;text-shadow:0 1px 12px rgba(0,0,0,.4)}
.hcard .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(15,12,20,.55));pointer-events:none}
.hcard p{margin:0;font-size:14px}
.credit{position:absolute;right:8px;top:8px;z-index:2;font-size:10px;line-height:1.4;color:#fff;text-decoration:none;background:rgba(0,0,0,.36);border-radius:6px;padding:1px 6px;max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.credit:hover{background:rgba(0,0,0,.6)}

/* 日ごとの予定 */
.day{display:grid;grid-template-columns:150px 1fr;gap:20px}
@media (max-width:720px){.day{grid-template-columns:1fr;gap:6px}}
.dayhead{position:sticky;top:20px;align-self:start}
@media (max-width:720px){.dayhead{position:static}}
.dayno{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,4vw,40px);line-height:1.1;color:var(--accent);display:block}
.daytheme{font-weight:700;font-size:15px;display:block;margin-top:6px}
.stops{list-style:none;margin:0;padding:0;min-width:0}
.stop-i{display:grid;grid-template-columns:52px 1fr;gap:0 14px;padding:12px 0;position:relative}
.stop-i::before{content:"";position:absolute;left:66px;top:30px;bottom:-12px;border-left:1px solid var(--line)}
.stop-i:last-child::before{display:none}
.t{font-family:var(--f-mono);font-size:13px;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.body{min-width:0;padding-left:20px;position:relative}
.body::before{content:"";position:absolute;left:-4px;top:9px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.place{font-weight:700}
.cost{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-left:8px;white-space:nowrap}
.act{margin:0}
.tip{margin:2px 0 0;font-size:13px;color:var(--muted)}
.body .ph{aspect-ratio:16/9;max-width:420px;margin-top:10px;border-radius:14px}
.links{display:inline-flex;gap:6px;margin-left:8px;vertical-align:1px}
.lk{font-size:11px;font-weight:700;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:1px 9px;white-space:nowrap}
.lk:hover{color:var(--accent);border-color:var(--accent)}

.meal{margin-top:2px;background:var(--soft);border-radius:16px;padding:12px 14px}
.mealtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mealtag{font-size:11px;font-weight:700;letter-spacing:.1em;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:1px 10px}
.best{font-size:11px;font-weight:700;color:var(--accent)}
.shop{font-weight:700;font-size:16px;margin:4px 0 0;line-height:1.45}
.shopmeta{font-size:13px;color:var(--muted);margin:0}
.why{margin:4px 0 0;font-size:14px}
.more{margin-top:10px;font:inherit;font-weight:700;font-size:13px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.more:hover{border-color:var(--accent)}
.more .arr{display:inline-block;transition:transform .2s}
.more[aria-expanded="true"] .arr{transform:rotate(180deg)}
.alts{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.alt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:start}
.alt .shop{font-size:15px;margin:0}
.alt .why{grid-column:1/-1;margin:0}
.pick{font:inherit;font-weight:700;font-size:12px;background:var(--sage-soft);color:var(--ink);border:1px solid var(--sage);border-radius:999px;padding:3px 11px;cursor:pointer;white-space:nowrap}

.extras{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:620px){.extras{grid-template-columns:1fr}}
.box{background:var(--soft);border-radius:20px;padding:20px 24px;min-width:0}
.box h3{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0 0 8px}
.box ul{margin:0;padding-left:1.2em}
.btable{width:100%;border-collapse:collapse;font-size:14px}
.btable td{padding:6px 0;border-bottom:1px solid var(--line)}
.btable td:last-child{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btable tr.total td{font-weight:700;border-bottom:0;color:var(--accent);font-size:15px}
.note{font-size:12px;color:var(--muted);margin:0;text-align:center}

/* 写真が隠れたあとに出る「条件を変える」ボタン */
.back{position:fixed;z-index:5;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(14px + var(--tabh) + env(safe-area-inset-bottom,0px));
  font:inherit;font-weight:700;font-size:13px;border:0;border-radius:999px;padding:11px 18px;background:var(--ink);color:var(--bg);cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,.2);transition:opacity .3s, transform .3s}
.back.off{opacity:0;transform:translateY(12px);pointer-events:none}

/* ===== 下のタブバー（App Store風） ===== */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar);border-top:1px solid var(--line);
  -webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);
  padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.tabbar nav{max-width:560px;margin:0 auto;height:var(--tabh);display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--muted);text-decoration:none;-webkit-tap-highlight-color:transparent}
.tab svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] svg{fill:var(--accent-soft)}
.tab:active svg{transform:scale(.88)}
.view[hidden]{display:none!important}

/* ===== 探す・マップ・保存の画面 ===== */
.page{min-height:100vh;min-height:100svh;padding-top:max(26px,env(safe-area-inset-top,0px));padding-bottom:calc(40px + var(--tabh) + env(safe-area-inset-bottom,0px))}
.pagewrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.ptitle{font-family:var(--f-display);font-weight:800;font-size:clamp(32px,6vw,44px);line-height:1.15;margin:0}
.psub{margin:4px 0 0;color:var(--muted);font-size:14px}
.sub{font-family:var(--f-display);font-weight:700;font-size:21px;margin:8px 0 0}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:14px;padding:0 6px 0 14px}
.searchbox svg{width:20px;height:20px;flex:none;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.searchbox input{background:transparent;border:0;padding:12px 4px;color:var(--ink)}
.searchbox input:focus{box-shadow:none}
.searchbox button{font:inherit;font-weight:700;font-size:13px;border:0;border-radius:10px;padding:7px 14px;background:var(--accent);color:#fff;cursor:pointer;white-space:nowrap}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.dcard{font:inherit;color:inherit;text-align:left;background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}
.dcard .ph{aspect-ratio:3/4;max-width:100%;width:100%}
.dcard .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(15,12,20,.6));pointer-events:none}
.dcard .nm{position:absolute;left:14px;bottom:12px;z-index:1;color:#fff;font-family:var(--f-display);font-weight:800;font-size:24px;text-shadow:0 1px 10px rgba(0,0,0,.4)}
.dcard .catch{font-size:13px;color:var(--muted)}
.dcard:hover .ph img.on{transform:scale(1.04)}

.empty{background:var(--soft);border-radius:20px;padding:28px 24px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty button{margin-top:12px}
.btn{text-decoration:none;font:inherit;font-weight:700;font-size:13px;border-radius:999px;padding:7px 16px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}

.slist{display:flex;flex-direction:column;gap:14px}
.scard{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;background:var(--soft);border-radius:20px;padding:10px;min-width:0}
.scard .ph{aspect-ratio:1/1;max-width:100%;border-radius:14px}
.scard h3{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.4;margin:0}
.scard .when{font-size:12px;color:var(--muted);margin:2px 0 0}
.scard .actions{margin-top:8px}

.chiprow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{font:inherit;font-weight:700;font-size:13px;border-radius:999px;padding:5px 14px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.mapbox{height:min(60svh,560px);min-height:320px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--soft);position:relative;z-index:0}
.mapnote{font-size:12px;color:var(--muted);margin:0}
.steps{list-style:none;margin:22px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:720px){.steps{grid-template-columns:1fr}}
.steps li{background:var(--soft);border-radius:20px;padding:18px 20px;font-size:14px;color:var(--muted);min-width:0}
.steps span{display:inline-block;font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;color:var(--accent);margin-bottom:8px}
.steps b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.mk{width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;font:700 12px/26px "DM Mono",monospace;text-align:center;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.mk.star{background:#fff;color:var(--c);border-color:var(--c);font-size:14px}
.leaflet-popup-content{font-family:var(--f-body);font-size:13px;line-height:1.6;margin:10px 14px}
.leaflet-popup-content b{font-size:14px}
.leaflet-popup-content a{color:#D9677A;font-weight:700}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plist button{font:inherit;color:inherit;text-align:left;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px;cursor:pointer;display:grid;grid-template-columns:30px 50px 1fr;gap:10px;align-items:center}
.plist .num{width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;font:700 11px/26px "DM Mono",monospace;text-align:center}
.plist .tm{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.plist .nm2{font-weight:700;min-width:0}
.plist .nm2 small{display:block;font-weight:500;color:var(--muted);font-size:12px}

/* スクロールで下からふわっと出る（動きを減らす設定の人には出さない） */
@media (prefers-reduced-motion:no-preference){
  .js .rv{opacity:0;transform:translateY(28px);transition:opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1)}
  .js .rv.in{opacity:1;transform:none}
}
@media (prefers-reduced-motion:reduce){
  .pin img{transform:none;filter:none;transition:none}
  .herotext,.glass,.cue{transform:none}
}
</style>
<script>document.documentElement.classList.add("js")</script>
</head>
<body>

<section class="view" id="v-home">
<div class="stage">
  <div class="pin" id="pin" aria-hidden="true"></div>

  <header class="hero gutter">
    <div class="brand">
      <p class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20C4 10.5 10.5 4 20 4c0 9.5-6.5 16-16 16z" fill="#fff"/><path d="M4.5 19.5L13 11" stroke="#D9677A" stroke-width="1.6" stroke-linecap="round"/></svg>Wayleaf<small>旅のしおりAI</small></p>
      <a class="credit-hero" id="heroCredit" target="_blank" rel="noopener" hidden></a>
    </div>

    <div class="herotext">
      <p class="eyebrow-w" id="heroEyebrow">旅のしおりを作ろう</p>
      <h1 class="place-name" id="heroPlace">どこ行く？</h1>
      <p class="hero-title" id="heroTitle"></p>
    </div>

    <form class="glass" id="f" autocomplete="off">
      <div class="grid">
        <label class="f wide">どこ行く？<input id="dest" required placeholder="例：京都、台北、ソウル"></label>
        <label class="f">日数<select id="days"></select></label>
        <label class="f">人数<select id="people"><option>1人</option><option selected>2人</option><option>3人</option><option>4人</option><option>5人以上</option></select></label>
        <label class="f">予算（1人）<select id="budget">
          <option>〜3万円</option><option selected>3〜6万円</option><option>6〜10万円</option><option>10〜20万円</option><option>20万円以上</option><option>特に決めない</option>
        </select></label>
        <button class="go" id="go" type="submit">プランを作る</button>
      </div>
      <details class="more-opts">
        <summary>こだわり条件</summary>
        <div class="opts">
          <label class="f">出発日<input id="start" type="date"></label>
          <label class="f">出発地<input id="from" value="東京" placeholder="例：東京"></label>
          <label class="f">ペース<select id="pace"><option>のんびり</option><option selected>ふつう</option><option>ぎっしり</option></select></label>
          <div class="full"><div class="legend">したいこと</div><div class="chips" id="interests"></div></div>
          <label class="f full">その他の希望<textarea id="notes" placeholder="例：朝は苦手。雑貨屋さんを見たい。雨の日の案も。"></textarea></label>
        </div>
      </details>
      <div class="status" id="status" role="status"></div>
    </form>

    <div class="cue"><button type="button" id="cue">スクロールしてプランを見る<span></span></button></div>
  </header>

  <main class="sheet gutter" id="plan" tabindex="-1">
    <div class="inner" id="inner"></div>
  </main>
</div>
<button class="back off" id="back" type="button">条件を変える ↑</button>
</section>

<section class="view page gutter" id="v-search" hidden>
  <div class="pagewrap">
    <div>
      <p class="eyebrow">次はどこへ行く？</p>
      <h1 class="ptitle">探す</h1>
    </div>
    <form class="searchbox" id="sf" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input id="sq" type="search" placeholder="行き先を検索（例：金沢、台北）" aria-label="行き先を検索">
      <button type="submit">決定</button>
    </form>
    <h2 class="sub">人気の行き先</h2>
    <div class="dgrid" id="dgrid"></div>
  </div>
</section>

<section class="view page gutter" id="v-map" hidden>
  <div class="pagewrap">
    <div>
      <p class="eyebrow">いまのプラン</p>
      <h1 class="ptitle">マップ</h1>
      <p class="psub" id="mapTitle"></p>
    </div>
    <div class="chiprow" id="dayChips"></div>
    <div class="mapbox" id="map"></div>
    <p class="mapnote" id="mapNote">地図の位置は目安です。お店はGoogleマップでも確認してね。</p>
    <ol class="plist" id="plist"></ol>
  </div>
</section>

<section class="view page gutter" id="v-saved" hidden>
  <div class="pagewrap">
    <div>
      <p class="eyebrow">あなたのしおり</p>
      <h1 class="ptitle">保存</h1>
      <p class="psub">このブラウザに保存されます。</p>
    </div>
    <div class="slist" id="slist"></div>
  </div>
</section>

<div class="tabbar">
  <nav aria-label="メニュー">
    <a class="tab" href="#home" data-v="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5L12 3.8l8.5 6.7V20a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1z"/></svg>ホーム</a>
    <a class="tab" href="#search" data-v="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>探す</a>
    <a class="tab" href="#map" data-v="map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5l5.5-2.5 6 2.5 5.5-2.5v13.5L15 20l-6-2.5-5.5 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg>マップ</a>
    <a class="tab" href="#saved" data-v="saved"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11a1 1 0 0 1 1 1v16l-6.5-4.2-6.5 4.2v-16a1 1 0 0 1 1-1z"/></svg>保存</a>
  </nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const GRADS = ["linear-gradient(135deg,#E9A6B3,#F3D2C1)","linear-gradient(135deg,#9CC3B4,#D7E7C8)","linear-gradient(135deg,#A9B9DD,#E2D3EE)","linear-gradient(135deg,#E8B98A,#F4DFB8)","linear-gradient(135deg,#B7A3D6,#EBC6D6)","linear-gradient(135deg,#8FB8CF,#CFE4E0)"];
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- 入力欄 ----------
  const daySel = $("#days");
  for (let i=1;i<=10;i++){ const o=document.createElement("option"); o.value=i; o.textContent = i===1?"日帰り":`${i-1}泊${i}日`; if(i===3)o.selected=true; daySel.append(o); }
  const INTERESTS = ["グルメ","カフェ巡り","スイーツ","映えスポット","ショッピング","観光名所","自然・景色","温泉","アート","夜景","雑貨屋さん","ナイトライフ"];
  const DEFAULT_ON = ["グルメ","カフェ巡り","スイーツ","映えスポット"];
  $("#interests").innerHTML = INTERESTS.map((t,i)=>`<label><input type="checkbox" id="int${i}" value="${t}" ${DEFAULT_ON.includes(t)?"checked":""}><span>${t}</span></label>`).join("");
  const d = new Date(); d.setDate(d.getDate()+14); $("#start").value = d.toISOString().slice(0,10);

  // ---------- スクロールの動き ----------
  const root = document.documentElement, back = $("#back");
  let ticking = false, current = "home";
  const toPlan = () => window.scrollTo({top: $("#plan").offsetTop, behavior: reduced ? "auto" : "smooth"});
  $("#cue").addEventListener("click", toPlan);
  function onScroll(){
    if (ticking) return; ticking = true;
    requestAnimationFrame(() => {
      if (current !== "home") { ticking = false; return; }
      const p = Math.min(Math.max(window.scrollY / window.innerHeight, 0), 1.2);
      if (!reduced) root.style.setProperty("--p", p.toFixed(4));
      back.classList.toggle("off", window.scrollY < window.innerHeight * 0.9);
      ticking = false;
    });
  }
  addEventListener("scroll", onScroll, {passive:true});
  addEventListener("resize", onScroll);
  onScroll();
  back.addEventListener("click", () => {
    window.scrollTo({top:0, behavior: reduced ? "auto" : "smooth"});
    setTimeout(() => $("#dest").focus({preventScroll:true}), reduced ? 0 : 600);
  });

  const io = "IntersectionObserver" in window ? new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
  }, {rootMargin:"0px 0px -8% 0px"}) : null;
  function watchReveal(scope){
    scope.querySelectorAll(".rv").forEach(el => io ? io.observe(el) : el.classList.add("in"));
  }

  // ---------- 写真（Wikipedia / Wikimedia Commons の自由に使える写真） ----------
  const photoCache = new Map();
  const strip = h => String(h||"").replace(/<[^>]*>/g,"").replace(/\s+/g," ").trim();
  const api = (host, params) => fetch(`https://${host}/w/api.php?` + new URLSearchParams({format:"json",origin:"*",...params}))
    .then(r => r.ok ? r.json() : null).catch(() => null);
  const firstPage = j => { const p = j?.query?.pages; return p ? Object.values(p).sort((a,b)=>(a.index||0)-(b.index||0))[0] : null; };
  const okFile = name => name && !/\.(svg|gif)$/i.test(name) && !/(logo|map|flag|emblem|symbol|地図|位置)/i.test(name);

  async function fromWikipedia(lang, title, search, size){
    const base = {action:"query",redirects:"1",prop:"pageimages",piprop:"thumbnail|name",pithumbsize:String(size)};
    const j = await api(`${lang}.wikipedia.org`, search ? {...base,generator:"search",gsrsearch:title,gsrlimit:"1"} : {...base,titles:title});
    const p = firstPage(j);
    if (!p || p.missing !== undefined || !p.thumbnail || !okFile(p.pageimage)) return null;
    return { src:p.thumbnail.source, file:p.pageimage, lang };
  }
  async function fromCommons(q, size){
    const j = await api("commons.wikimedia.org", {action:"query",generator:"search",gsrsearch:q+" filetype:bitmap",gsrnamespace:"6",gsrlimit:"5",prop:"imageinfo",iiprop:"url|extmetadata",iiurlwidth:String(size)});
    const pages = j?.query?.pages ? Object.values(j.query.pages).sort((a,b)=>(a.index||0)-(b.index||0)) : [];
    for (const p of pages){
      const name = p.title.replace(/^File:/,""), ii = p.imageinfo?.[0];
      if (ii?.thumburl && okFile(name)) return { src:ii.thumburl, credit:creditFrom(ii) };
    }
    return null;
  }
  function creditFrom(ii){
    const m = ii.extmetadata || {};
    const artist = strip(m.Artist?.value) || "作者不明";
    const lic = strip(m.LicenseShortName?.value) || "";
    return { text:`写真: ${artist}${lic?" / "+lic:""}`, url: ii.descriptionurl };
  }
  async function creditFor(file, lang){
    for (const host of ["commons.wikimedia.org", `${lang}.wikipedia.org`]){
      const p = firstPage(await api(host, {action:"query",titles:"File:"+file,prop:"imageinfo",iiprop:"url|extmetadata"}));
      if (p?.imageinfo?.[0]) return creditFrom(p.imageinfo[0]);
    }
    return { text:"写真: Wikipedia", url:`https://${lang}.wikipedia.org/wiki/File:${encodeURIComponent(file)}` };
  }
  function findPhoto(wiki, en, name, size=1100){
    const key = [wiki,en,name,size].join("|");
    if (photoCache.has(key)) return photoCache.get(key);
    const job = (async () => {
      let hit = null;
      if (wiki) hit = await fromWikipedia("ja", wiki, false, size) || await fromWikipedia("ja", wiki, true, size);
      if (!hit && en) hit = await fromWikipedia("en", en, false, size) || await fromWikipedia("en", en, true, size);
      if (!hit && name) hit = await fromWikipedia("ja", name, true, size);
      if (hit) return { src:hit.src, credit: await creditFor(hit.file, hit.lang) };
      return await fromCommons(en || wiki || name, size);
    })().catch(() => null);
    photoCache.set(key, job);
    return job;
  }
  let running = 0; const queue = [];
  const limit = fn => new Promise(res => { queue.push(() => fn().then(res)); pump(); });
  function pump(){ while (running < 4 && queue.length){ running++; queue.shift()().finally(() => { running--; pump(); }); } }

  function addCredit(el, credit, cls){
    if (!credit) return;
    const a = document.createElement("a");
    a.className = cls; a.href = credit.url; a.target = "_blank"; a.rel = "noopener";
    a.textContent = credit.text; el.append(a);
  }
  function loadPhotos(scope){
    scope.querySelectorAll(".ph[data-q]:not([data-done])").forEach(el => {
      el.dataset.done = "1";
      const {wiki="", en="", name=""} = el.dataset;
      limit(() => findPhoto(wiki, en, name)).then(ph => {
        if (!ph || !el.isConnected) { if (el.classList.contains("opt")) el.hidden = true; return; }
        const img = new Image();
        img.alt = el.dataset.alt || name || wiki;
        img.loading = "lazy"; img.decoding = "async"; img.referrerPolicy = "no-referrer";
        img.onload = () => img.classList.add("on");
        img.onerror = () => { if (el.classList.contains("opt")) el.hidden = true; };
        img.src = ph.src;
        el.prepend(img);
        addCredit(el, ph.credit, "credit");
      });
    });
  }
  const phTag = (cls, {wiki="",en="",name="",alt=""}, i=0, inner="") =>
    `<div class="ph ${cls}" style="--g:${GRADS[i%GRADS.length]}" data-q="1" data-wiki="${esc(wiki)}" data-en="${esc(en)}" data-name="${esc(name)}" data-alt="${esc(alt||name||wiki)}">${inner}</div>`;

  // 一番上の大きな写真（新しい写真が読み込めたらふわっと入れ替える）
  let heroToken = 0;
  function setHero(wiki, en, name){
    const token = ++heroToken, pin = $("#pin"), cr = $("#heroCredit");
    findPhoto(wiki, en, name, 2000).then(ph => {
      if (token !== heroToken || !ph) return;
      const img = new Image();
      img.alt = ""; img.decoding = "async"; img.referrerPolicy = "no-referrer";
      img.onload = () => {
        if (token !== heroToken) return;
        const old = [...pin.querySelectorAll("img")];
        pin.append(img);
        requestAnimationFrame(() => img.classList.add("on"));
        setTimeout(() => old.forEach(o => o.remove()), 1000);
        if (ph.credit){ cr.textContent = ph.credit.text; cr.href = ph.credit.url; cr.hidden = false; } else cr.hidden = true;
      };
      img.src = ph.src;
    });
  }

  // ---------- 表示 ----------
  let plan = null, planIsExample = false, dest = "", savedId = null, mapDirty = true;
  const open = new Set();
  const mapUrl = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q + " " + dest);
  const photoUrl = q => "https://www.google.com/search?tbm=isch&q=" + encodeURIComponent(dest + " " + q);
  const links = q => `<span class="links"><a class="lk" href="${photoUrl(q)}" target="_blank" rel="noopener">写真</a><a class="lk" href="${mapUrl(q)}" target="_blank" rel="noopener">地図</a></span>`;
  const shopBlock = s => `<p class="shop">${esc(s.name)}</p><p class="shopmeta">${esc([s.genre,s.price].filter(Boolean).join("・"))}${links(s.name)}</p>`;

  function itemHTML(it, di, ii){
    const key = di+"-"+ii;
    let inner;
    if (it.type === "meal" && it.shop){
      const alts = Array.isArray(it.alternatives) ? it.alternatives : [];
      const isOpen = open.has(key);
      inner = `<div class="meal">
          <div class="mealtop"><span class="mealtag">${esc(it.meal || "ごはん")}</span><span class="best">いちばんのおすすめ</span></div>
          ${shopBlock(it.shop)}
          ${it.shop.why?`<p class="why">${esc(it.shop.why)}</p>`:""}
          ${alts.length?`<button class="more" type="button" data-k="${key}" aria-expanded="${isOpen}">ほかのおすすめ ${alts.length}件 <span class="arr">▾</span></button>`:""}
          ${isOpen?`<ul class="alts">${alts.map((a,ai)=>`<li class="alt"><div>${shopBlock(a)}</div>
              <button class="pick" type="button" data-k="${key}" data-a="${ai}">ここにする</button>
              ${a.why?`<p class="why">${esc(a.why)}</p>`:""}</li>`).join("")}</ul>`:""}
        </div>`;
    } else {
      inner = `<div><span class="place">${esc(it.place)}</span>${it.cost?`<span class="cost">${esc(it.cost)}</span>`:""}${it.place?links(it.place):""}</div>
        ${it.activity?`<p class="act">${esc(it.activity)}</p>`:""}
        ${it.tip?`<p class="tip">ひとこと：${esc(it.tip)}</p>`:""}
        ${it.wiki?phTag("opt",{wiki:it.wiki,name:it.place},di+ii):""}`;
    }
    return `<li class="stop-i"><span class="t">${esc(it.time)}</span><div class="body">${inner}</div></li>`;
  }

  function renderHero(){
    if (!plan){
      heroToken++;
      $("#heroEyebrow").textContent = "旅のしおりを作ろう";
      $("#cue").firstChild.textContent = "スクロールして使い方を見る";
      $("#heroPlace").textContent = "どこ行く？";
      $("#heroTitle").textContent = "行き先を入れるだけで、見どころ・予定・ごはん屋さんまでAIがまとめます。";
      $("#pin").querySelectorAll("img").forEach(i => { i.classList.remove("on"); setTimeout(() => i.remove(), 900); });
      $("#heroCredit").hidden = true;
      return;
    }
    $("#heroEyebrow").textContent = planIsExample ? "見本プラン" : "あなたのプラン";
    $("#cue").firstChild.textContent = "スクロールしてプランを見る";
    $("#heroPlace").textContent = dest;
    $("#heroTitle").textContent = plan.title || "";
    setHero(plan.destWiki || dest, plan.destEn || "", dest);
  }

  const loadLast = () => { try { const l = JSON.parse(localStorage.getItem("tabi-shiori:last") || "null"); return l && l.plan && Array.isArray(l.plan.days) ? l : null; } catch { return null; } };
  function renderEmpty(reveal){
    const rv = reveal ? " rv" : "", last = loadLast();
    $("#inner").innerHTML = `
      <section class="intro${rv}">
        <p class="eyebrow">使い方</p>
        <h2>3ステップで、旅のしおりができあがり</h2>
        <ol class="steps">
          <li><span>1</span><b>行き先を決める</b>上の「どこ行く？」に入れるか、下の「探す」から人気の行き先を選ぶ。</li>
          <li><span>2</span><b>条件を入れる</b>日数・人数・予算を選ぶ。「こだわり条件」でしたいことや希望も伝えられる。</li>
          <li><span>3</span><b>プランを作る</b>見どころの写真、日ごとの予定、ごはん屋さんまで1分ほどでできあがり。</li>
        </ol>
        <div class="actions">
          <a class="btn primary" href="#search">人気の行き先から探す</a>
          ${last ? `<button class="btn" type="button" id="lastBtn">前回のプラン（${esc(last.dest)}）を見る</button>` : ""}
        </div>
      </section>`;
    if (reveal) watchReveal($("#inner"));
  }
  function render(reveal){
    if (!plan) return renderEmpty(reveal);
    const p = plan, rv = reveal ? " rv" : "";
    const days = Array.isArray(p.days)?p.days:[], hl = Array.isArray(p.highlights)?p.highlights:[];
    const budget = Array.isArray(p.budget)?p.budget:[], tips = Array.isArray(p.tips)?p.tips:[], pack = Array.isArray(p.packing)?p.packing:[];
    $("#inner").innerHTML = `
      <section class="intro${rv}">
        <p class="eyebrow">${planIsExample?"見本プラン":"あなたのプラン"}</p>
        <h2>${esc(p.title)}</h2>
        <p class="sum">${esc(p.summary)}</p>
        <div class="meta">${(p.meta||[]).map(m=>`<span>${esc(m.label)}：${esc(m.value)}</span>`).join("")}</div>
        <div class="actions">
          <button class="btn primary" type="button" id="saveBtn">${savedId ? "保存済み ✓" : "このプランを保存"}</button>
          <a class="btn" href="#map">マップで見る</a>
        </div>
      </section>
      ${hl.length?`<section class="${rv}">
        <div class="secthead"><h3>${esc(dest)}の見どころ</h3><span>横にスワイプ ／ 写真はWikipedia・Wikimedia Commonsより</span></div>
        <div class="rail">${hl.map((h,i)=>`<article class="hcard">
            ${phTag("",h,i,`<span class="nm">${esc(h.name)}</span>`)}
            <p>${esc(h.feature)}</p>
          </article>`).join("")}</div>
      </section>`:""}
      ${days.map((dy,di)=>`<section class="day${rv}">
          <div class="dayhead"><span class="dayno">${esc(dy.label||((di+1)+"日目"))}</span><span class="daytheme">${esc(dy.theme)}</span></div>
          <ol class="stops">${(dy.items||[]).map((it,ii)=>itemHTML(it,di,ii)).join("")}</ol>
        </section>`).join("")}
      <div class="extras${rv}">
        ${budget.length?`<div class="box"><h3>予算のめやす（1人）</h3><table class="btable">${budget.map((b,i)=>`<tr class="${i===budget.length-1&&/合計/.test(b.item)?"total":""}"><td>${esc(b.item)}</td><td>${esc(b.amount)}</td></tr>`).join("")}</table></div>`:""}
        <div class="box"><h3>旅のコツ</h3><ul>${tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>
          ${pack.length?`<h3 style="margin-top:14px">持ち物</h3><ul>${pack.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:""}</div>
      </div>
      <p class="note">お店の営業日・予約の有無は、行く前に地図やお店のページで確認してね。</p>`;
    loadPhotos($("#inner"));
    if (reveal) watchReveal($("#inner"));
  }

  $("#inner").addEventListener("click", e => {
    if (e.target.closest("#saveBtn")) { saveCurrent(); return; }
    if (e.target.closest("#lastBtn")) {
      const l = loadLast(); if (!l) return;
      plan = l.plan; dest = l.dest; planIsExample = false; savedId = null; open.clear(); mapDirty = true;
      renderHero(); render(true); toPlan(); return;
    }
    const more = e.target.closest(".more"), pick = e.target.closest(".pick");
    if (!more && !pick) return;
    const k = (more||pick).dataset.k;
    if (more) open.has(k) ? open.delete(k) : open.add(k);
    else {
      const [di,ii] = k.split("-").map(Number), ai = Number(pick.dataset.a);
      const it = plan.days[di].items[ii], chosen = it.alternatives[ai];
      it.alternatives[ai] = it.shop; it.shop = chosen; open.delete(k);
      mapDirty = true; if (savedId) updateSaved();
    }
    render(false);
    document.querySelector(`.more[data-k="${k}"]`)?.focus({preventScroll:true});
  });

  // ---------- 画面の切り替え（下のタブバー） ----------
  const VIEWS = ["home","search","map","saved"];
  const scrolls = {};
  function showView(name){
    if (!VIEWS.includes(name)) name = "home";
    if (name === current && !$("#v-"+name).hidden) return;
    scrolls[current] = window.scrollY;
    VIEWS.forEach(v => { $("#v-"+v).hidden = v !== name; });
    document.querySelectorAll(".tab").forEach(t => t.dataset.v === name ? t.setAttribute("aria-current","page") : t.removeAttribute("aria-current"));
    current = name;
    window.scrollTo(0, scrolls[name] || 0);
    if (name === "home") onScroll();
    if (name === "search") renderSearch();
    if (name === "saved") renderSaved();
    if (name === "map") showMap();
  }
  addEventListener("hashchange", () => showView(location.hash.slice(1)));

  // ---------- 探す ----------
  const POPULAR = [
    {name:"京都",wiki:"京都市",en:"Kyoto",catch:"古都さんぽと抹茶スイーツ"},
    {name:"沖縄",wiki:"古宇利島",en:"Kouri Island",catch:"青い海と島ドライブ"},
    {name:"金沢",wiki:"兼六園",en:"Kenroku-en",catch:"庭園と金箔ソフト"},
    {name:"札幌",wiki:"札幌市",en:"Sapporo",catch:"スープカレーと夜景"},
    {name:"福岡",wiki:"福岡市",en:"Fukuoka",catch:"屋台ともつ鍋"},
    {name:"箱根",wiki:"芦ノ湖",en:"Lake Ashi",catch:"温泉と湖の景色"},
    {name:"ソウル",wiki:"ソウル特別市",en:"Seoul",catch:"カフェと韓国コスメ"},
    {name:"釜山",wiki:"甘川文化村",en:"Gamcheon Culture Village",catch:"カラフルな町と海"},
    {name:"台北",wiki:"台北市",en:"Taipei",catch:"夜市と小籠包"},
    {name:"バンコク",wiki:"バンコク",en:"Bangkok",catch:"寺院とナイトマーケット"},
    {name:"ホノルル",wiki:"ワイキキ",en:"Waikiki",catch:"ビーチとパンケーキ"},
    {name:"パリ",wiki:"パリ",en:"Paris",catch:"街歩きとパティスリー"}];
  let searchDone = false;
  function renderSearch(){
    if (searchDone) return; searchDone = true;
    $("#dgrid").innerHTML = POPULAR.map((p,i)=>`<button class="dcard" type="button" data-i="${i}">
        ${phTag("",p,i,`<span class="nm">${esc(p.name)}</span>`)}<span class="catch">${esc(p.catch)}</span></button>`).join("");
    loadPhotos($("#dgrid"));
  }
  $("#dgrid").addEventListener("click", e => {
    const c = e.target.closest(".dcard"); if (!c) return;
    const p = POPULAR[Number(c.dataset.i)];
    pickDest(p.name, p.wiki, p.en);
  });
  $("#sf").addEventListener("submit", e => {
    e.preventDefault();
    const q = $("#sq").value.trim(); if (!q) { $("#sq").focus(); return; }
    pickDest(q, q, "");
  });
  function pickDest(name, wiki, en){
    $("#dest").value = name;
    location.hash = "home";
    scrolls.home = 0; window.scrollTo(0,0);
    $("#heroEyebrow").textContent = "行き先を決めました";
    $("#heroPlace").textContent = name;
    $("#heroTitle").textContent = "日数や予算を決めて「プランを作る」を押してね";
    setHero(wiki, en, name);
    status("");
    setTimeout(() => $("#days").focus({preventScroll:true}), 50);
  }

  // ---------- 保存 ----------
  const KEY = "tabi-shiori:saved";
  function loadSaved(){ try { const a = JSON.parse(localStorage.getItem(KEY) || "[]"); return Array.isArray(a) ? a : []; } catch { return []; } }
  function storeSaved(a){ try { localStorage.setItem(KEY, JSON.stringify(a.slice(0,30))); return true; } catch { return false; } }
  function saveCurrent(){
    if (savedId) { location.hash = "saved"; return; }
    const a = loadSaved(), id = Date.now().toString(36);
    a.unshift({id, savedAt:Date.now(), dest, example:planIsExample, plan:JSON.parse(JSON.stringify(plan))});
    if (!storeSaved(a)) { const b = $("#saveBtn"); if (b) b.textContent = "保存できませんでした"; return; }
    savedId = id;
    const b = $("#saveBtn"); if (b) b.textContent = "保存済み ✓";
  }
  function updateSaved(){
    const a = loadSaved(), s = a.find(x => x.id === savedId);
    if (s) { s.plan = JSON.parse(JSON.stringify(plan)); storeSaved(a); }
  }
  function renderSaved(){
    const a = loadSaved();
    if (!a.length){
      $("#slist").innerHTML = `<div class="empty"><b>まだ保存したプランはありません</b>ホームでプランを作って「このプランを保存」を押すと、ここに並びます。<br><a class="btn primary" href="#home" style="margin-top:12px">ホームへ</a></div>`;
      return;
    }
    $("#slist").innerHTML = a.map((s,i)=>{
      const days = Array.isArray(s.plan?.days) ? s.plan.days.length : 0;
      const dt = new Date(s.savedAt);
      return `<article class="scard">
        ${phTag("",{wiki:s.plan?.destWiki||s.dest,en:s.plan?.destEn||"",name:s.dest},i)}
        <div style="min-width:0">
          <h3>${esc(s.plan?.title || s.dest)}</h3>
          <p class="when">${esc(s.dest)}・${days}日間・${dt.getMonth()+1}月${dt.getDate()}日に保存${s.example?"（見本）":""}</p>
          <div class="actions">
            <button class="btn primary" type="button" data-open="${esc(s.id)}">開く</button>
            <button class="btn" type="button" data-del="${esc(s.id)}">削除</button>
          </div>
        </div>
      </article>`;
    }).join("");
    loadPhotos($("#slist"));
  }
  $("#slist").addEventListener("click", e => {
    const o = e.target.closest("[data-open]"), d = e.target.closest("[data-del]");
    if (o){
      const s = loadSaved().find(x => x.id === o.dataset.open); if (!s) return;
      plan = s.plan; dest = s.dest; planIsExample = !!s.example; savedId = s.id; open.clear(); mapDirty = true;
      $("#dest").value = dest;
      renderHero(); render(true);
      scrolls.home = 0; location.hash = "home";
    } else if (d){
      if (d.dataset.armed !== "1"){
        d.dataset.armed = "1"; d.textContent = "本当に削除？"; d.classList.add("danger");
        setTimeout(() => { if (d.isConnected){ d.dataset.armed = ""; d.textContent = "削除"; d.classList.remove("danger"); } }, 3000);
        return;
      }
      storeSaved(loadSaved().filter(x => x.id !== d.dataset.del));
      if (savedId === d.dataset.del) savedId = null;
      renderSaved();
    }
  });

  // ---------- マップ ----------
  const DAYC = ["#D9677A","#4F9A80","#5F7FC6","#CF8434","#9372C6","#3E9BB3","#B5657F"];
  const coordCache = new Map();
  const num = v => (typeof v === "number" || typeof v === "string") && v !== "" && isFinite(+v) ? +v : NaN;
  const okLL = (lat,lng) => isFinite(lat) && isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180 && !(lat === 0 && lng === 0);
  function wikiCoords(title){
    if (!title) return Promise.resolve(null);
    if (coordCache.has(title)) return coordCache.get(title);
    const job = api("ja.wikipedia.org", {action:"query",prop:"coordinates",titles:title,redirects:"1"}).then(j => {
      const c = firstPage(j)?.coordinates?.[0];
      return c ? {lat:c.lat, lng:c.lon} : null;
    });
    coordCache.set(title, job);
    return job;
  }
  async function where(obj){
    const w = obj.wiki ? await wikiCoords(obj.wiki) : null;
    if (w) return w;
    const lat = num(obj.lat), lng = num(obj.lng);
    return okLL(lat,lng) ? {lat,lng} : null;
  }
  let map = null, mapLayer = null, points = [], dayFilter = "all", lastBounds = null;
  function fitToPoints(){ if (map && lastBounds) map.fitBounds(lastBounds, {padding:[40,40], maxZoom:15}); }
  async function collectPoints(){
    const out = [], days = Array.isArray(plan.days) ? plan.days : [];
    for (let di=0; di<days.length; di++){
      let n = 0;
      for (const it of (days[di].items || [])){
        const isMeal = it.type === "meal" && it.shop;
        const target = isMeal ? it.shop : it;
        const name = isMeal ? it.shop.name : it.place;
        if (!name) continue;
        n++;
        out.push({day:di, n, time:it.time||"", name, sub: isMeal ? `${it.meal||"ごはん"}・${it.shop.genre||""}` : (it.activity||""), ll: where(target)});
      }
    }
    (Array.isArray(plan.highlights) ? plan.highlights : []).forEach(h => out.push({day:-1, n:"★", time:"", name:h.name, sub:"見どころ", ll: where(h)}));
    await Promise.all(out.map(async p => { p.ll = await p.ll; }));
    return out.filter(p => p.ll);
  }
  async function showMap(){
    $("#map").hidden = !plan; $("#mapNote").hidden = !plan;
    if (!plan){
      $("#mapTitle").textContent = "";
      $("#dayChips").innerHTML = "";
      $("#plist").innerHTML = `<li class="empty"><b>まだプランがありません</b>ホームでプランを作ると、行く場所がここの地図に出ます。<br><a class="btn primary" href="#home" style="margin-top:12px">ホームへ</a></li>`;
      return;
    }
    $("#mapTitle").textContent = plan.title || "";
    if (!window.L){ $("#map").innerHTML = `<div class="empty" style="margin:20px">地図を読み込めませんでした。ページを再読み込みしてね。</div>`; return; }
    if (!map){
      map = L.map("map", {zoomControl:true, scrollWheelZoom:false, tap:true});
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom:19,
        attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);
      map.setView([35.0116,135.7681], 12);
    }
    setTimeout(() => { map.invalidateSize(); fitToPoints(); }, 60);
    if (!mapDirty) return;
    mapDirty = false; dayFilter = "all";
    $("#plist").innerHTML = `<li class="mapnote" style="padding:10px 0">場所を調べています…</li>`;
    const myPlan = plan;
    const pts = await collectPoints();
    if (myPlan !== plan) return;
    points = pts;
    const days = Array.isArray(plan.days) ? plan.days : [];
    $("#dayChips").innerHTML = [`<button class="chip" type="button" data-d="all" aria-pressed="true">すべて</button>`]
      .concat(days.map((d,i)=>`<button class="chip" type="button" data-d="${i}" aria-pressed="false">${esc(d.label||((i+1)+"日目"))}</button>`))
      .concat(points.some(p=>p.day===-1) ? [`<button class="chip" type="button" data-d="-1" aria-pressed="false">見どころ</button>`] : []).join("");
    drawMap();
  }
  function drawMap(){
    if (mapLayer) mapLayer.remove();
    mapLayer = L.layerGroup().addTo(map);
    const vis = points.filter(p => dayFilter === "all" || String(p.day) === dayFilter);
    const byDay = {};
    vis.forEach((p,i) => {
      const c = p.day === -1 ? "#7A7680" : DAYC[p.day % DAYC.length];
      const icon = L.divIcon({className:"", html:`<div class="mk${p.day===-1?" star":""}" style="--c:${c}">${esc(String(p.n))}</div>`, iconSize:[30,30], iconAnchor:[15,15], popupAnchor:[0,-14]});
      const label = p.day === -1 ? "見どころ" : `${esc(plan.days[p.day]?.label || (p.day+1)+"日目")} ${esc(p.time)}`;
      const g = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(p.name + " " + dest);
      p.marker = L.marker([p.ll.lat, p.ll.lng], {icon, title:p.name}).addTo(mapLayer)
        .bindPopup(`<b>${esc(p.name)}</b><br><span style="color:#7A7680">${label}</span><br>${esc(p.sub)}<br><a href="${g}" target="_blank" rel="noopener">Googleマップで開く</a>`);
      if (p.day >= 0) (byDay[p.day] = byDay[p.day] || []).push([p.ll.lat, p.ll.lng]);
    });
    Object.entries(byDay).forEach(([d,ll]) => { if (ll.length > 1) L.polyline(ll, {color:DAYC[d % DAYC.length], weight:3, opacity:.7, dashArray:"6 8"}).addTo(mapLayer); });
    lastBounds = vis.length ? L.latLngBounds(vis.map(p => [p.ll.lat, p.ll.lng])) : null;
    map.invalidateSize();
    fitToPoints();
    $("#plist").innerHTML = vis.length ? vis.map((p,i)=>`<li><button type="button" data-p="${points.indexOf(p)}">
        <span class="num" style="--c:${p.day===-1?"#7A7680":DAYC[p.day % DAYC.length]}">${esc(String(p.n))}</span>
        <span class="tm">${esc(p.day===-1?"":(plan.days[p.day]?.label||"")+" "+p.time)}</span>
        <span class="nm2">${esc(p.name)}<small>${esc(p.sub)}</small></span></button></li>`).join("")
      : `<li class="empty">地図に出せる場所が見つかりませんでした。</li>`;
  }
  $("#dayChips").addEventListener("click", e => {
    const c = e.target.closest(".chip"); if (!c) return;
    dayFilter = c.dataset.d;
    document.querySelectorAll("#dayChips .chip").forEach(x => x.setAttribute("aria-pressed", String(x === c)));
    drawMap();
  });
  $("#plist").addEventListener("click", e => {
    const b = e.target.closest("[data-p]"); if (!b) return;
    const p = points[Number(b.dataset.p)]; if (!p?.marker) return;
    window.scrollTo({top: $("#map").getBoundingClientRect().top + window.scrollY - 80, behavior: reduced ? "auto" : "smooth"});
    map.setView(p.marker.getLatLng(), Math.max(map.getZoom(), 15));
    p.marker.openPopup();
  });

  renderHero();
  render(true);
  current = "";
  showView(location.hash.slice(1) || "home");

  // ---------- プランを作る ----------
  const status = (t, err) => { const s=$("#status"); s.textContent=t; s.classList.toggle("err",!!err); };
  let busy = false;
  $("#f").addEventListener("submit", async e => {
    e.preventDefault();
    if (busy) return;
    const destVal = $("#dest").value.trim();
    if (!destVal) { status("行き先を入れてね。", true); return; }
    busy = true; $("#go").disabled = true; $("#go").textContent = "作成中…"; $("#plan").classList.add("loading");
    // 行き先の写真だけ先に切り替える
    $("#heroPlace").textContent = destVal; $("#heroTitle").textContent = ""; $("#heroEyebrow").textContent = "プランを作っています";
    setHero(destVal, "", destVal);
    status("見どころ・プラン・お店を考え中…（30秒〜1分ほど）");
    const waits = [
      setTimeout(() => status("お店や移動時間を調べています…もう少し待ってね。"), 35000),
      setTimeout(() => status("今日はAIが少し混んでいるみたい。あと少しでできあがります…"), 75000),
      setTimeout(() => status("まだ考えています…長い日程だと2〜3分かかることがあります。"), 130000)];
    try {
      const r = await fetch("/api/plan", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          dest:destVal, days:$("#days").value, people:$("#people").value, start:$("#start").value,
          from:$("#from").value, budget:$("#budget").value, pace:$("#pace").value, notes:$("#notes").value,
          interests:[...document.querySelectorAll("#interests input:checked")].map(i=>i.value)
        })
      });
      const raw = await r.text();
      let data = {}; try { data = JSON.parse(raw); } catch {}
      if (!r.ok || !Array.isArray(data.days)) {
        let msg = data.error;
        if (!msg && r.status === 404) msg = "AIの部分（api/plan.js）が見つかりません。GitHubにapiフォルダが入っているか確認してね。";
        if (!msg && (r.status === 504 || /TIMEOUT/i.test(raw))) msg = "AIの返事に時間がかかりすぎました。日数を短くするか、もう一度試してね。";
        msg = (msg || "プランを作れませんでした。もう一度試してね。") + `（エラー番号 ${r.status}${data.detail ? "：" + data.detail : ""}）`;
        throw new Error(msg);
      }
      plan = data; planIsExample = false; dest = destVal; open.clear(); savedId = null; mapDirty = true;
      try { localStorage.setItem("tabi-shiori:last", JSON.stringify({dest, plan})); } catch {}
      renderHero();
      render(true);
      status("できました。下にスクロールしてね。");
      // 写真の上にプランがせり上がってくるところまで自動でスクロール
      setTimeout(() => window.scrollTo({top: $("#plan").offsetTop, behavior: reduced ? "auto" : "smooth"}), 350);
    } catch (err) {
      status(err.message || "通信に失敗しました。もう一度試してね。", true);
      $("#heroEyebrow").textContent = "プランを作れませんでした";
      $("#heroTitle").textContent = "少し時間をおいて、もう一度「プランを作る」を押してね。";
    } finally {
      waits.forEach(clearTimeout);
      busy = false; $("#go").disabled = false; $("#go").textContent = "プランを作る"; $("#plan").classList.remove("loading");
    }
  });
})();
</script>
</body>
</html>
